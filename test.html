<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Lokasi - Simple Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .info-item {
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }
        
        .info-item:last-child {
            border-bottom: none;
        }
        
        .label {
            font-weight: bold;
            color: #667eea;
        }
        
        .error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .loading.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 Test Geolocation</h1>
        
        <button onclick="getLocation()">Dapatkan Lokasi GPS</button>
        <button onclick="getLocationIP()">Dapatkan Lokasi IP</button>
        
        <div class="loading" id="loading">
            <p>⏳ Mendapatkan lokasi...</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="result" id="result">
            <div class="info-item">
                <span class="label">Latitude:</span>
                <span id="lat">-</span>
            </div>
            <div class="info-item">
                <span class="label">Longitude:</span>
                <span id="lng">-</span>
            </div>
            <div class="info-item">
                <span class="label">Akurasi:</span>
                <span id="acc">-</span>
            </div>
            <div class="info-item">
                <span class="label">Metode:</span>
                <span id="method">-</span>
            </div>
        </div>
    </div>

    <script>
        function showLoading() {
            document.getElementById('loading').classList.add('show');
            document.getElementById('error').classList.remove('show');
            document.getElementById('result').classList.remove('show');
        }
        
        function hideLoading() {
            document.getElementById('loading').classList.remove('show');
        }
        
        function showError(msg) {
            hideLoading();
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = msg;
            errorDiv.classList.add('show');
        }
        
        function showResult(lat, lng, acc, method) {
            hideLoading();
            document.getElementById('lat').textContent = lat.toFixed(6);
            document.getElementById('lng').textContent = lng.toFixed(6);
            document.getElementById('acc').textContent = acc;
            document.getElementById('method').textContent = method;
            document.getElementById('result').classList.add('show');
        }
        
        function getLocation() {
            console.log('🔍 Meminta lokasi GPS...');
            
            if (!navigator.geolocation) {
                showError('❌ Browser tidak mendukung Geolocation');
                return;
            }
            
            showLoading();
            
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    console.log('✅ Sukses:', position);
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const acc = Math.round(position.coords.accuracy) + ' meter';
                    showResult(lat, lng, acc, 'GPS/WiFi');
                },
                function(error) {
                    console.error('❌ Error:', error);
                    let msg = '';
                    switch(error.code) {
                        case 1:
                            msg = '❌ Akses lokasi ditolak. Izinkan akses lokasi di browser.';
                            break;
                        case 2:
                            msg = '❌ Lokasi tidak tersedia. Coba aktifkan GPS/WiFi.';
                            break;
                        case 3:
                            msg = '❌ Timeout. Coba lagi atau gunakan lokasi IP.';
                            break;
                        default:
                            msg = '❌ Error: ' + error.message;
                    }
                    showError(msg);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        }
        
        async function getLocationIP() {
            console.log('🌐 Mendapatkan lokasi dari IP...');
            showLoading();
            
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                console.log('✅ Data IP:', data);
                
                if (data.latitude && data.longitude) {
                    const location = `${data.city}, ${data.country_name}`;
                    showResult(data.latitude, data.longitude, location, 'IP Address');
                } else {
                    showError('❌ Gagal mendapatkan lokasi dari IP');
                }
            } catch (error) {
                console.error('❌ Error IP:', error);
                showError('❌ Gagal: ' + error.message);
            }
        }
        
        // Test otomatis saat halaman dimuat
        console.log('✅ Halaman test dimuat!');
        console.log('✅ Geolocation support:', 'geolocation' in navigator);
    </script>
</body>
</html>
